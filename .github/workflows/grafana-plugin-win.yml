name: Grafana plugin windows build

on:
  push:
    branches:
      - master
      - "new_*"
  pull_request:
    branches:
      - master
      - "new_*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v2.1.5
        with:
          node-version: "14.x"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - name: Cache yarn cache
        uses: actions/cache@v2
        id: cache-yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v2
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ matrix.node-version }}-nodemodules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.node-version }}-nodemodules-

      - name: Install dependencies and Build and test frontend
        run: |
          cd ./grafana-plugin
          yarn install --frozen-lockfile
          yarn build
          ls

      - name: Install dependencies and Build backend
        run: |
          cd grafana-plugin
          go version
          go env -w GOPROXY=https://goproxy.cn
          go get -u github.com/grafana/grafana-plugin-sdk-go
          go mod tidy
          go env
          go run C:\\Users\\runneradmin\\go\\pkg\\mod\\github.com\\magefile\\mage@v1.13.0\\bootstrap.go
          dir
          echo "-----------222----------"
          C:\Users\runneradmin\go\pkg\mod\github.com\magefile\mage@v1.13.0\mage -v
          echo "------****---------------"