name: Grafana plugin build

on:
  push:
    branches:
      - grafana_test_0613
      - "new_*"
  pull_request:
    branches:
      - grafana_test_0613
      - "new_*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v2.1.5
        with:
          node-version: "14.x"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - name: Cache yarn cache
        uses: actions/cache@v2
        id: cache-yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v2
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ matrix.node-version }}-nodemodules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.node-version }}-nodemodules-

      - name: Install dependencies and Build and test frontend
        run: |
          cd ./grafana-plugin
          yarn install --frozen-lockfile
          yarn build

      - name: Install dependencies and Build backend
        run: |
          cd ./grafana-plugin
          ./backend-compile.sh

      - name: Sign grafana plugin
        run: npx @grafana/sign-plugin@latest --distDir ./grafana-plugin/dist --rootUrls https://example.com/grafana
        env:
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_PLUGIN_TOKEN }}

      - name: Package plugin
        run: |
          cd ./grafana-plugin
          mv dist apache-iotdb-datasource
          zip -r apache-iotdb-datasource.zip apache-iotdb-datasource
          

      - name: Upload artifact
        uses: actions/upload-artifact@v2
        with:
          name: signed-plugin
          path: ./grafana-plugin/apache-iotdb-datasource.zip
